# Docker Compose for Snapcraft development
version: '3.8'

services:
  snapcraft-dev:
    build: .
    container_name: snapcraft-dev
    volumes:
      - .:/snapcraft
      - uv-cache:/root/.cache/uv
    environment:
      - SNAPCRAFT_ENABLE_DEVELOPER_DEBUG=1
    working_dir: /snapcraft
    stdin_open: true
    tty: true

volumes:
  uv-cache:
